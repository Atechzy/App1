name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Relocate Files to Project Root
        run: |
          if [ -d ".github/workflows/app" ]; then
            mv .github/workflows/app ./
            mv .github/workflows/*.gradle.kts ./ 2>/dev/null || true
            mv .github/workflows/gradle.properties ./ 2>/dev/null || true
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Wrapper & Build APK/AAB
        run: |
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
